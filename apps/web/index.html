<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="description" content="Tus cuentas, tus gastos y tus objetivos, en tu propio servidor." />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <!--
      Lo que iOS no saca del manifest. `black` y no `black-translucent`: con la
      barra traslúcida el contenido se metería debajo, y AppLayout solo reserva
      el hueco de abajo (el de TabBar), no el de la barra de estado.
    -->
    <link rel="apple-touch-icon" href="/apple-touch-icon-180.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Finanzas" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <title>Finanzas</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
