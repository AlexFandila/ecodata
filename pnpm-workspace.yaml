packages:
  - 'apps/*'
  - 'packages/*'

# Scripts de instalación permitidos. pnpm los bloquea por defecto (protección de
# cadena de suministro): cada entrada aquí es una decisión consciente.
allowBuilds:
  # Enlaza el binario nativo del compilador que usan Vite, Vitest y tsup.
  esbuild: true

# pnpm rechaza por defecto versiones publicadas hace muy poco (ventana de
# cuarentena frente a paquetes comprometidos). Estas tres se excluyen a
# propósito para poder usar su última versión; revisar de vez en cuando si
# siguen haciendo falta.
minimumReleaseAgeExclude:
  - hono@4.13.1
  - tsx@4.23.10
  - vite@8.2.1
